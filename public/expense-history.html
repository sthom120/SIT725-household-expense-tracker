<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense History - Household Expense Tracker</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
  >
</head>

<body>

  <div class="container">
    <h4>Expense History</h4>

    <div class="row">
      <div class="input-field col s12 m4">
        <select id="categoryFilter">
          <option value="">All categories</option>
        </select>
        <label>Category</label>
      </div>

      <div class="input-field col s6 m4">
        <input id="startDate" type="date">
        <label for="startDate" class="active">From</label>
      </div>

      <div class="input-field col s6 m4">
        <input id="endDate" type="date">
        <label for="endDate" class="active">To</label>
      </div>
    </div>

    <button id="applyFiltersButton" class="btn" type="button">
      Apply Filters
    </button>
    <button id="clearFiltersButton" class="btn grey" type="button">
      Clear Filters
    </button>

    <table class="striped">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Paid by</th>
        </tr>
      </thead>
      <tbody id="expenseList"></tbody>
    </table>

    <p id="message"></p>
  </div>
  <script
  src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js">
</script>
  <script src="js/expenseHistory.js"></script>

</body>
</html>
