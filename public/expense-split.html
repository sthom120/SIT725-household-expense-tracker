<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Split Expense - Household Expense Tracker</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
  >
</head>

<body>

  <div class="container">
    <h4>Split Expense</h4>

    <p>Select the household members who are sharing this expense.</p>
<div class="input-field">
  <input id="expenseAmount" type="number" min="0.01" step="0.01">
  <label for="expenseAmount">Expense Amount ($)</label>
</div>

    <div id="participantList"></div>
<button id="calculateSplitButton" class="btn" type="button">
  Calculate Split
</button>

<div id="splitResult"></div>
    <p id="message"></p>
  </div>

  <script src="js/expenseParticipants.js"></script>

</body>
</html>
